[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vdm_pokemon"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "mila_golomozin", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["optional-dependencies"]
dependencies = [
    "dvc-gs>=3.0.2",
    "ema-pytorch==0.4.8",
    "fastapi==0.115.12",
    "hydra-core==1.3.2",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "typer==0.15.2",
    "uvicorn==0.34.2",
    "wandb==0.18.0",
]

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ['requirements_dev.txt']}

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "N", "E", "W", ]

[tool.coverage.run]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "pytest>=8.3.4",
    "pytest-cov",
]
